<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chalet Savard — Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a1119;
  --panel:rgba(17,22,29,0.72);
  --border:rgba(255,255,255,0.06);
  --text:#eaf2ff;
  --muted:#7c8ca3;
  --blue:#00c8ff;
  --green:#39d98a;
  --purple:#7b61ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background: radial-gradient(circle at top left, rgba(0,200,255,0.12), transparent 25%),
              radial-gradient(circle at bottom right, rgba(123,97,255,0.12), transparent 25%),
              var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
}

.live{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--green);
  font-weight:600;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.4);opacity:.4;}
  100%{transform:scale(1);opacity:1;}
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:0 20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
}

.value{
  font-size:3rem;
  font-weight:700;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:20px;
}

/* IMPORTANT FIX ICI */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  height:320px;              /* 🔥 FIX HAUTEUR STABLE */
  display:flex;
  flex-direction:column;
}

canvas{
  flex:1;                    /* 🔥 empêche débordement */
  width:100% !important;
  height:100% !important;
}

/* responsive */
@media(max-width:900px){
  .cards,.grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h2>🏡 Chalet Savard</h2>
    <small>Dashboard météo intelligent</small>
  </div>

  <div class="live">
    <div class="dot"></div>
    EN DIRECT
  </div>
</div>

<!-- CARDS -->
<div class="cards">
  <div class="card">
    <div>Extérieur</div>
    <div class="value" style="color:var(--blue)">18.4°</div>
  </div>

  <div class="card">
    <div>Intérieur</div>
    <div class="value" style="color:var(--green)">21.7°</div>
  </div>

  <div class="card">
    <div>Eau</div>
    <div class="value" style="color:var(--purple)">5.8°</div>
  </div>
</div>

<!-- GRAPHIQUES -->
<div class="grid">

  <div class="panel">
    <h4>Température extérieure</h4>
    <canvas id="c1"></canvas>
  </div>

  <div class="panel">
    <h4>Température intérieure</h4>
    <canvas id="c2"></canvas>
  </div>

  <div class="panel">
    <h4>Température eau</h4>
    <canvas id="c3"></canvas>
  </div>

</div>

<script>

/* GRADIENT */
function gradient(ctx,color){
  const g = ctx.createLinearGradient(0,0,0,300);
  g.addColorStop(0,color.replace('rgb','rgba').replace(')',',0.35)'));
  g.addColorStop(1,color.replace('rgb','rgba').replace(')',',0'));
  return g;
}

/* DATA MOCK */
function data(base){
  return Array.from({length:12},()=>base + (Math.random()*4-2));
}

function labels(){
  return ['00h','02h','04h','06h','08h','10h','12h','14h','16h','18h','20h','22h'];
}

/* CHART */
function make(id,color,val){
  const ctx = document.getElementById(id).getContext('2d');

  return new Chart(ctx,{
    type:'line',
    data:{
      labels:labels(),
      datasets:[{
        data:val,
        borderColor:color,
        backgroundColor:gradient(ctx,color),
        fill:true,
        tension:0.35,
        pointRadius:0,
        borderWidth:2
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,   // 🔥 CRUCIAL
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#7c8ca3'},grid:{color:'rgba(255,255,255,0.03)'}},
        y:{ticks:{color:'#7c8ca3'},grid:{color:'rgba(255,255,255,0.03)'}}
      }
    }
  });
}

/* INIT */
make('c1','rgb(0,200,255)',data(15));
make('c2','rgb(57,217,138)',data(21));
make('c3','rgb(123,97,255)',data(6));

</script>

</body>
</html>
