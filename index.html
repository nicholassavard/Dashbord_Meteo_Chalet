<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏡 Chalet Savard — Dashboard Premium</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#081018;
  --panel:rgba(17,22,29,0.75);
  --border:rgba(255,255,255,0.06);
  --text:#eef5ff;
  --muted:#7f8ea3;
  --blue:#00c8ff;
  --green:#39d98a;
  --purple:#7b61ff;
  --orange:#ff8c42;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#071018,#0d141d);
  color:var(--text);
}

.container{padding:18px;display:flex;flex-direction:column;gap:16px;}

/* HEADER */
.header{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel);border:1px solid var(--border);
  border-radius:26px;padding:24px;
}
.live{display:flex;gap:10px;align-items:center;color:var(--green);}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:22px;}
.label{color:var(--muted);font-size:.75rem;margin-bottom:10px;text-transform:uppercase;}
.value{font-size:3.2rem;font-weight:700;}
.unit{font-size:1.2rem;opacity:.7;}
.meta{margin-top:10px;color:var(--muted);font-size:.85rem;display:flex;gap:10px;flex-wrap:wrap;}

/* GRID */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  padding:16px;
  height:340px;
  display:flex;
  flex-direction:column;
}

.panel-head{display:flex;justify-content:space-between;margin-bottom:10px;}
.panel-title{text-transform:uppercase;font-size:.75rem;color:var(--muted);}

canvas{flex:1;width:100%!important;height:100%!important;}

/* TOOLTIP GLOBAL */
.tooltip{
  position:absolute;
  background:rgba(10,15,20,.95);
  border:1px solid rgba(255,255,255,.08);
  padding:10px 12px;
  border-radius:12px;
  font-size:.8rem;
  pointer-events:none;
  display:none;
  z-index:999;
}

.btn{
  background:#111;
  border:1px solid #222;
  padding:8px 14px;
  color:#aaa;
  cursor:pointer;
  border-radius:10px;
}

.btn.active{color:white;border-color:#444;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
  <div>
    <h2>🏡 Chalet Savard</h2>
    <div style="color:#7f8ea3">Dashboard météo Ecowitt</div>
  </div>
  <div class="live">● <span id="status">Connecté</span></div>
</div>

<!-- RANGE -->
<div class="toolbar">
  <button class="btn range active" data="1d">1j</button>
  <button class="btn range" data="1w">1w</button>
  <button class="btn range" data="1m">1m</button>
  <button class="btn range" data="3m">3m</button>
  <button class="btn range" data="1y">1y</button>
</div>

<!-- CARDS -->
<div class="cards">

  <div class="card">
    <div class="label">Extérieure</div>
    <div class="value" style="color:var(--blue)">
      <span id="ext-temp">--</span><span class="unit">°C</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Intérieure</div>
    <div class="value" style="color:var(--green)">
      <span id="int-temp">--</span><span class="unit">°C</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Eau</div>
    <div class="value" style="color:var(--purple)">
      <span id="water-temp">--</span><span class="unit">°C</span>
    </div>
    <div style="margin-top:8px;color:#b8a8ff;font-weight:600">
      <span id="water-f">--</span> °F
    </div>
  </div>

</div>

<!-- CHARTS -->
<div class="grid3">

  <div class="panel">
    <div class="panel-head"><div class="panel-title">Ext</div></div>
    <canvas id="c1"></canvas>
  </div>

  <div class="panel">
    <div class="panel-head"><div class="panel-title">Int</div></div>
    <canvas id="c2"></canvas>
  </div>

  <div class="panel">
    <div class="panel-head"><div class="panel-title">Eau</div></div>
    <canvas id="c3"></canvas>
  </div>

</div>

</div>

<script>

const APP_KEY='4E38524335ACBCBFA94809FD60EB2071';
const API_KEY='c6288d22-7592-4772-b9c9-e472e08e3421';
const MAC='84:1F:E8:35:E4:93';

let RANGE='1d';

const charts={};

/* CROSSHAIR GLOBAL */
let syncIndex=null;

function makeChart(id,color){

  const ctx=document.getElementById(id);

  return new Chart(ctx,{

    type:'line',

    data:{labels:[],datasets:[{
      data:[],
      borderColor:color,
      tension:.3,
      pointRadius:0
    }]},

    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      onHover:(e,elements,chart)=>{

        if(elements.length){
          syncIndex=elements[0].index;
          showTooltip(elements[0],chart);
        }

      }
    }

  });

}

/* TOOLTIP SIMPLE */
const tip=document.createElement('div');
tip.className='tooltip';
document.body.appendChild(tip);

function showTooltip(el,chart){

  const i=el.index;

  let html=`<b>${chart.data.labels[i]}</b><br>`;

  chart.data.datasets.forEach(d=>{
    html+=`${parseFloat(d.data[i]).toFixed(1)}<br>`;
  });

  tip.innerHTML=html;
  tip.style.display='block';
  tip.style.left=(el.element.x+40)+'px';
  tip.style.top=(el.element.y+80)+'px';

}

/* INIT CHARTS */
charts.ext=makeChart('c1','rgb(0,200,255)');
charts.int=makeChart('c2','rgb(57,217,138)');
charts.water=makeChart('c3','rgb(123,97,255)');

/* API */
async function api(endpoint){

  const url=`https://api.ecowitt.net/api/v3/device/${endpoint}?application_key=${APP_KEY}&api_key=${API_KEY}&mac=${MAC}&temp_unitid=1`;

  const r=await fetch(url);
  const j=await r.json();
  return j.data;

}

/* LIVE */
async function live(){

  const d=await api('real_time');

  const get=(o,k)=>o?.[k]?.value;

  const w=get(d.temp_and_humidity_ch2,'temperature');
  const wF=(w*9/5)+32;

  document.getElementById('water-temp').textContent=w.toFixed(1);
  document.getElementById('water-f').textContent=wF.toFixed(1);

}

/* HISTORY */
async function history(){

  const d=await api('history');

  function parse(obj){

    if(!obj?.list) return [];

    return Object.entries(obj.list).map(([t,v])=>({
      t:+t,v:+v
    }));

  }

  const ext=parse(d.temp_and_humidity_ch1?.temperature);
  const int=parse(d.indoor?.temperature);
  const wat=parse(d.temp_and_humidity_ch2?.temperature);

  charts.ext.data.labels=ext.map(x=>new Date(x.t*1000).toLocaleTimeString());
  charts.ext.data.datasets[0].data=ext.map(x=>x.v);

  charts.int.data.labels=charts.ext.data.labels;
  charts.int.data.datasets[0].data=int.map(x=>x.v);

  charts.water.data.labels=charts.ext.data.labels;
  charts.water.data.datasets[0].data=wat.map(x=>x.v);

  charts.ext.update();
  charts.int.update();
  charts.water.update();

}

/* RANGE */
document.querySelectorAll('.range').forEach(b=>{
  b.onclick=()=>{

    document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');

    RANGE=b.dataset;

    history();

  };
});

/* LOOP */
setInterval(live,60000);
live();
history();

</script>

</body>
</html>
