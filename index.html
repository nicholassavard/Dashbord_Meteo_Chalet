<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalet</title>
<style>
  body { background:#111; color:#fff; font-family:monospace; padding:40px; font-size:1.2rem; }
  .val { font-size:3rem; color:#00c8ff; margin:8px 0 24px; }
</style>
</head>
<body>
  <p>Extérieure (CH1)</p>
  <div class="val" id="ext">--</div>

  <p>Intérieure</p>
  <div class="val" id="int" style="color:#39d98a">--</div>

  <p>Eau (CH2)</p>
  <div class="val" id="water" style="color:#7b61ff">--</div>

  <p id="status" style="font-size:0.8rem;color:#555">Chargement…</p>

<script>
const APP_KEY = '4E38524335ACBCBFA94809FD60EB2071';
const API_KEY = 'c6288d22-7592-4772-b9c9-e472e08e3421';
const MAC     = '84:1F:E8:35:E4:93';

async function fetch_data() {
  const api = `https://api.ecowitt.net/api/v3/device/real_time?application_key=${APP_KEY}&api_key=${API_KEY}&mac=${MAC}&call_back=all&temp_unitid=1`;

  // Essai direct, puis allorigins
  const urls = [
    api,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(api)}`
  ];

  for (const url of urls) {
    try {
      const res  = await fetch(url);
      const json = await res.json();
      if (json.code !== 0) continue;

      const d = json.data;
      const ext   = d?.temp_and_humidity_ch1?.temperature?.value;
      const int_  = d?.indoor?.temperature?.value;
      const water = d?.temp_and_humidity_ch2?.temperature?.value;

      document.getElementById('ext').textContent   = ext   ? ext   + ' °C' : '--';
      document.getElementById('int').textContent   = int_  ? int_  + ' °C' : '--';
      document.getElementById('water').textContent = water ? water + ' °C' : '--';
      document.getElementById('status').textContent = '✅ ' + new Date().toLocaleTimeString('fr-CA');
      return;
    } catch(e) { continue; }
  }
  document.getElementById('status').textContent = '❌ Erreur connexion';
}

fetch_data();
setInterval(fetch_data, 60000);
</script>
</body>
</html>
