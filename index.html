<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalet — Températures</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0e11;
    color: #c8d8e4;
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    border-bottom: 1px solid #1a2530;
  }

  .site-title {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #4a6478;
  }

  #clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.3rem;
    color: #c8d8e4;
    letter-spacing: 0.08em;
  }

  #dateline {
    font-size: 0.7rem;
    color: #4a6478;
    text-align: right;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── Cartes ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #1a2530;
    border-bottom: 1px solid #1a2530;
  }

  .card {
    background: #0f1519;
    padding: 28px 28px 22px;
    position: relative;
  }

  .card-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .card-label {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4a6478;
    margin-bottom: 14px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 3.8rem;
    line-height: 1;
    color: #ffffff;
  }

  .card-unit {
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    color: #4a6478;
    font-weight: 300;
    margin-left: 4px;
  }

  .card-sub {
    margin-top: 14px;
    display: flex;
    gap: 20px;
  }

  .sub-item .sub-label {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #4a6478;
  }

  .sub-item .sub-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    color: #8aa8be;
    margin-top: 2px;
  }

  /* ── Graphiques ── */
  .charts {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #1a2530;
  }

  .chart-panel {
    background: #0b0e11;
    padding: 20px 24px 16px;
  }

  .chart-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4a6478;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .chart-range {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: #4a6478;
  }

  canvas { width: 100% !important; }

  /* ── Footer ── */
  footer {
    padding: 10px 28px;
    border-top: 1px solid #1a2530;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-left {
    font-size: 0.65rem;
    color: #2a3d4e;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: #4a6478;
  }

  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #39d98a;
    margin-right: 6px;
    animation: blink 2s infinite;
  }

  .dot.err { background: #ff6b35; animation: none; }

  @keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:0.2; }
  }

  @media (max-width: 600px) {
    .cards, .charts { grid-template-columns: 1fr; }
    .card-value { font-size: 3rem; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">Chalet · Saint-Félicien</div>
  <div>
    <div id="clock">--:--:--</div>
    <div id="dateline">--</div>
  </div>
</header>

<div class="cards">

  <!-- Extérieure -->
  <div class="card">
    <div class="card-accent" style="background:#00c8ff;"></div>
    <div class="card-label">Extérieure</div>
    <div>
      <span class="card-value" id="val-ext">--</span>
      <span class="card-unit">°C</span>
    </div>
    <div class="card-sub">
      <div class="sub-item">
        <div class="sub-label">Ressenti</div>
        <div class="sub-val" id="val-feels">--°</div>
      </div>
      <div class="sub-item">
        <div class="sub-label">Min 24h</div>
        <div class="sub-val" id="val-ext-min">--°</div>
      </div>
      <div class="sub-item">
        <div class="sub-label">Max 24h</div>
        <div class="sub-val" id="val-ext-max">--°</div>
      </div>
    </div>
  </div>

  <!-- Intérieure -->
  <div class="card">
    <div class="card-accent" style="background:#39d98a;"></div>
    <div class="card-label">Intérieure</div>
    <div>
      <span class="card-value" id="val-int">--</span>
      <span class="card-unit">°C</span>
    </div>
    <div class="card-sub">
      <div class="sub-item">
        <div class="sub-label">Min 24h</div>
        <div class="sub-val" id="val-int-min">--°</div>
      </div>
      <div class="sub-item">
        <div class="sub-label">Max 24h</div>
        <div class="sub-val" id="val-int-max">--°</div>
      </div>
    </div>
  </div>

  <!-- Eau -->
  <div class="card">
    <div class="card-accent" style="background:#7b61ff;"></div>
    <div class="card-label">Eau</div>
    <div>
      <span class="card-value" id="val-water">--</span>
      <span class="card-unit">°C</span>
    </div>
    <div class="card-sub">
      <div class="sub-item">
        <div class="sub-label">Min 24h</div>
        <div class="sub-val" id="val-water-min">--°</div>
      </div>
      <div class="sub-item">
        <div class="sub-label">Max 24h</div>
        <div class="sub-val" id="val-water-max">--°</div>
      </div>
    </div>
  </div>

</div>

<div class="charts">
  <div class="chart-panel">
    <div class="chart-label">
      <span>Extérieure — 24h</span>
      <span class="chart-range" id="range-ext">--</span>
    </div>
    <canvas id="chart-ext" height="140"></canvas>
  </div>
  <div class="chart-panel">
    <div class="chart-label">
      <span>Intérieure — 24h</span>
      <span class="chart-range" id="range-int">--</span>
    </div>
    <canvas id="chart-int" height="140"></canvas>
  </div>
  <div class="chart-panel">
    <div class="chart-label">
      <span>Eau — 24h</span>
      <span class="chart-range" id="range-water">--</span>
    </div>
    <canvas id="chart-water" height="140"></canvas>
  </div>
</div>

<footer>
  <div class="footer-left">GW3000B · Ecowitt Cloud</div>
  <div id="status"><span class="dot" id="dot"></span><span id="status-text">Connexion…</span></div>
</footer>

<script>
// ── Config ────────────────────────────────────────────────
const APP_KEY  = '4E38524335ACBCBFA94809FD60EB2071';
const API_KEY  = 'c6288d22-7592-4772-b9c9-e472e08e3421';
const MAC      = '84:1F:E8:35:E4:93';
const PROXY    = 'https://corsproxy.io/?';
const INTERVAL = 60000; // 60s
const MAX_PTS  = 288;   // 24h × 1pt/5min

// ── Historique ────────────────────────────────────────────
let hist = { ext: [], int: [], water: [] };
let charts = {};
let lastPush = 0;

// ── Horloge ───────────────────────────────────────────────
const DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(x => String(x).padStart(2,'0')).join(':');
  document.getElementById('dateline').textContent =
    `${DAYS[n.getDay()]} ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}
setInterval(tick, 1000);
tick();

// ── Chart factory ─────────────────────────────────────────
function makeChart(id, color) {
  const ctx = document.getElementById(id).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: color,
        backgroundColor: color.replace(')', ', 0.07)').replace('rgb', 'rgba'),
        borderWidth: 1.5,
        pointRadius: 0,
        pointHoverRadius: 3,
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f1519',
          borderColor: color,
          borderWidth: 1,
          titleColor: '#8aa8be',
          bodyColor: color,
          titleFont: { family: 'Share Tech Mono' },
          bodyFont: { family: 'Share Tech Mono' },
          callbacks: { label: c => ` ${c.parsed.y.toFixed(1)} °C` }
        }
      },
      scales: {
        x: {
          grid: { color: '#141c23' },
          ticks: { color: '#2e4557', font: { family: 'Share Tech Mono', size: 9 }, maxTicksLimit: 8, maxRotation: 0 },
          border: { color: '#1a2530' }
        },
        y: {
          grid: { color: '#141c23' },
          ticks: { color: '#2e4557', font: { family: 'Share Tech Mono', size: 9 }, callback: v => `${v.toFixed(0)}°` },
          border: { color: '#1a2530' }
        }
      }
    }
  });
}

function initCharts() {
  charts.ext   = makeChart('chart-ext',   'rgb(0, 200, 255)');
  charts.int   = makeChart('chart-int',   'rgb(57, 217, 138)');
  charts.water = makeChart('chart-water', 'rgb(123, 97, 255)');
}

// ── Mettre à jour un graphique ────────────────────────────
function updateChart(key, rangeId) {
  const h = hist[key];
  if (!h.length || !charts[key]) return;

  const fmt = ts => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };

  charts[key].data.labels = h.map(p => fmt(p.t));
  charts[key].data.datasets[0].data = h.map(p => p.v);
  charts[key].update('none');

  const vals = h.map(p => p.v);
  document.getElementById(rangeId).textContent =
    `↓ ${Math.min(...vals).toFixed(1)}°  ↑ ${Math.max(...vals).toFixed(1)}°`;
}

// ── Helpers ───────────────────────────────────────────────
function setVal(id, v, decimals = 1) {
  const el = document.getElementById(id);
  if (el) el.textContent = v !== null ? parseFloat(v).toFixed(decimals) : '--';
}

function ecowittVal(obj, key) {
  return obj && obj[key] && obj[key].value !== undefined
    ? parseFloat(obj[key].value) : null;
}

function minMax(key, id_min, id_max) {
  const vals = hist[key].map(p => p.v);
  if (!vals.length) return;
  document.getElementById(id_min).textContent = `${Math.min(...vals).toFixed(1)}°`;
  document.getElementById(id_max).textContent = `${Math.max(...vals).toFixed(1)}°`;
}

// ── Fetch Ecowitt ─────────────────────────────────────────
async function fetchEcowitt() {
  const dot  = document.getElementById('dot');
  const stxt = document.getElementById('status-text');
  try {
    const apiUrl =
      `https://api.ecowitt.net/api/v3/device/real_time` +
      `?application_key=${APP_KEY}` +
      `&api_key=${API_KEY}` +
      `&mac=${MAC}` +
      `&call_back=all` +
      `&temp_unitid=1` +
      `&pressure_unitid=3` +
      `&wind_speed_unitid=7` +
      `&rainfall_unitid=12`;

    const res  = await fetch(PROXY + encodeURIComponent(apiUrl));
    const json = await res.json();

    if (json.code !== 0) throw new Error(json.msg || 'API error');

    const d     = json.data;
    const out   = d.outdoor   || {};
    const inn   = d.indoor    || {};
    const wat   = d.water_temp || d.soil_ch1 || {}; // capteur eau

    const tempExt   = ecowittVal(out, 'temperature');
    const feelsLike = ecowittVal(out, 'feels_like') ?? tempExt;
    const tempInt   = ecowittVal(inn, 'temperature');
    const tempWater = ecowittVal(wat, 'temperature');

    // Affichage valeurs
    setVal('val-ext',   tempExt);
    setVal('val-feels', feelsLike);
    setVal('val-int',   tempInt);
    setVal('val-water', tempWater);

    // Historique (toutes les 5 min)
    const now = Date.now();
    if (now - lastPush >= 5 * 60 * 1000) {
      if (tempExt   !== null) { hist.ext.push({t: now, v: tempExt});   if (hist.ext.length   > MAX_PTS) hist.ext.shift();   }
      if (tempInt   !== null) { hist.int.push({t: now, v: tempInt});   if (hist.int.length   > MAX_PTS) hist.int.shift();   }
      if (tempWater !== null) { hist.water.push({t: now, v: tempWater}); if (hist.water.length > MAX_PTS) hist.water.shift(); }
      lastPush = now;
      updateChart('ext',   'range-ext');
      updateChart('int',   'range-int');
      updateChart('water', 'range-water');
      minMax('ext',   'val-ext-min',   'val-ext-max');
      minMax('int',   'val-int-min',   'val-int-max');
      minMax('water', 'val-water-min', 'val-water-max');
    }

    // Statut
    const t = new Date();
    dot.className = 'dot';
    stxt.textContent = `Mis à jour ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;

  } catch(e) {
    console.warn('Ecowitt error:', e);
    dot.className = 'dot err';
    stxt.textContent = 'Erreur connexion';
  }
}

// ── Démarrage ─────────────────────────────────────────────
initCharts();
fetchEcowitt();
setInterval(fetchEcowitt, INTERVAL);
</script>
</body>
</html>
